<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Who Knows Me Better?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/bondhu/assets/css/style.css" />
    <link rel="stylesheet" href="/bondhu/assets/css/auth.css" />
    <link rel="stylesheet" href="/bondhu/assets/css/responsive.css" />
  </head>
  <body data-auth-page="register">
    <header id="app-header" class="site-header"></header>

    <main class="page-main">
      <div class="auth-wrapper">
        <div class="card auth-card">
          <h1 class="auth-title">📝 Register</h1>

          <div id="auth-error" class="auth-alert hidden" role="alert"></div>

          <form id="register-form" class="auth-form">
            <div>
              <label for="reg-name" class="form-label">Name</label>
              <input
                id="reg-name"
                type="text"
                autocomplete="name"
                placeholder="Your Name"
                maxlength="80"
                required
                class="form-input"
              />
            </div>

            <div>
              <label for="reg-username" class="form-label">Username</label>
              <div class="input-prefix-wrap">
                <span class="input-prefix">@</span>
                <input
                  id="reg-username"
                  type="text"
                  autocomplete="username"
                  placeholder="Username"
                  maxlength="24"
                  required
                  class="form-input input-with-prefix"
                />
              </div>
              <p id="username-hint" class="field-hint muted hidden"></p>
            </div>

            <div>
              <label for="reg-password" class="form-label">Password</label>
              <div class="input-prefix-wrap">
                <input
                  id="reg-password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Password (min 6 chars)"
                  required
                  class="form-input input-with-toggle"
                />
                <button
                  type="button"
                  id="toggle-password-btn"
                  class="password-toggle-btn"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>

            <button id="register-submit-btn" type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
              Register
            </button>
          </form>

          <p class="auth-footer-link" style="margin-top: 1.5rem; text-align: center;">
            <a id="switch-to-login" href="/bondhu/login" class="text-link" style="font-weight: 700;">Login</a>
          </p>
        </div>
      </div>
    </main>

    <nav id="mobile-nav" class="mobile-bottom-nav" aria-label="Mobile navigation"></nav>
    <div id="toast-root" class="toast-stack" aria-live="polite"></div>

    <script type="module" src="/bondhu/assets/js/auth.js"></script>
  </body>
</html>
